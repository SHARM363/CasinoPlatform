<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSK32 - Register / Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
<!-- Banner Slider -->
<div class="banner-slider">

    <div class="banner-track">

        <img src="images/banner1.jpg" alt="Banner 1">
        <img src="images/banner2.jpg" alt="Banner 2">
        <img src="images/banner3.jpg" alt="Banner 3">

    </div>

</div>
        <div class="logo">
            RSK32
        </div>

        <h1>Welcome to RSK32</h1>
        <p class="subtitle">Create your account or login</p>

        <div class="tabs">
            <button id="loginTab" class="active">Login</button>
            <button id="registerTab">Register</button>
        </div>

        <!-- Login -->
        <form id="loginForm">

            <input
                type="text"
                id="loginUsername"
                placeholder="Username or Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit" class="main-btn">
                Login
            </button>

        </form>

        <!-- Register -->
        <form id="registerForm" style="display:none;">

            <input
                type="text"
                id="registerUsername"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
                required
            >

            <button type="submit" class="main-btn">
                Create Account
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
