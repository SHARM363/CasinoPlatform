<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07091c">
<title>RSK32 - Super Ace</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#07091c;color:#fff}
button{font:inherit;border:0;outline:0;cursor:pointer}
body{background:radial-gradient(circle at 50% 20%,rgba(55,32,90,.55),transparent 42%),linear-gradient(180deg,#07091c 0%,#10102b 38%,#260e0b 100%)}
#app{width:100%;height:100%;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,rgba(255,177,25,.08),transparent 36%),linear-gradient(180deg,#090b22 0%,#17132d 55%,#2b1009 100%)}
.topbar{height:62px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#050611,#11142a);border-bottom:1px solid rgba(255,214,79,.18);position:relative;z-index:10}
.brand{font-family:Georgia,serif;font-weight:900;font-size:28px;letter-spacing:2px;color:#ffd84a;text-shadow:2px 3px 0 #8b4a00,0 0 14px rgba(255,190,30,.35)}
.top-title{font-weight:900;font-size:15px;letter-spacing:1px;color:#f6d77c}
.icon-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:21px;border:1px solid rgba(255,255,255,.1)}
.sound-on{background:rgba(67,92,190,.45)}
.main{height:calc(100% - 62px);overflow:hidden;position:relative}
.wood{position:absolute;left:0;right:0;top:205px;height:105px;background:linear-gradient(180deg,#7a351d,#4b1c10 45%,#2d100a);border-top:5px solid #9b542e;border-bottom:5px solid #260b06;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.game-area{position:absolute;inset:0;padding:12px 10px 0;display:flex;flex-direction:column}
.multiplier-title{text-align:center;font-family:Georgia,serif;font-size:38px;font-weight:900;color:#ffd06b;text-shadow:2px 3px 0 #71300e,0 0 12px rgba(255,184,40,.25);margin:5px 0}
.multiplier-bar{height:58px;border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:4px 8px;margin:0 6px 12px;background:linear-gradient(180deg,#ffd85a,#e89b0a 52%,#b75b00);border:3px solid #6d3000;box-shadow:inset 0 2px 0 #fff4a0,0 5px 12px rgba(0,0,0,.5)}
.mult{height:42px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;color:#17100a}
.mult.active{color:#fff;background:linear-gradient(180deg,#ff3b22,#c40000);box-shadow:0 0 12px rgba(255,60,30,.75),inset 0 2px 0 rgba(255,255,255,.45)}
.reel-frame{position:relative;flex:1;min-height:0;padding:7px;border-radius:18px;background:linear-gradient(180deg,#5b2a12,#1c0c07);border:4px solid #8b512d;box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 0 0 2px #150806}
.reels{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;overflow:hidden;border-radius:11px;background:#c5cad9}
.reel{min-width:0;display:flex;flex-direction:column;gap:5px;overflow:hidden;background:linear-gradient(90deg,#adb3c4,#eef1f8 50%,#aeb5c7);border-left:1px solid rgba(0,0,0,.25);border-right:1px solid rgba(255,255,255,.45)}
.symbol{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(145deg,#e9edf7,#cdd4e3 52%,#eef2fa);border:1px solid rgba(44,48,70,.35);border-radius:4px;color:#10152b;font-family:Georgia,serif;font-weight:900;font-size:clamp(38px,11vw,67px);text-shadow:1px 2px 0 rgba(255,255,255,.75),0 2px 3px rgba(0,0,0,.2)}
.symbol.red{color:#b00014}.symbol.gold{color:#d99000}.symbol.ace{color:#162348}
.symbol.wild{background:radial-gradient(circle,#ffe57d,#d58b00 70%);color:#5c1a00;font-size:clamp(28px,8vw,52px)}
.symbol.win{animation:winPulse .65s ease-in-out infinite alternate;box-shadow:inset 0 0 0 4px #ffe55b,0 0 16px #ffc400;z-index:3}
@keyframes winPulse{to{filter:brightness(1.45);transform:scale(.96)}}
.reels.spinning .symbol{animation:blurSpin .11s linear infinite}
@keyframes blurSpin{50%{filter:blur(3px);transform:translateY(5px)}}
.result{height:54px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;font-weight:800}
.result strong{font-size:26px;color:#fff;text-shadow:0 2px 4px #000}
.result .win-label{color:#ffd43b;font-size:20px}
.controls{display:grid;grid-template-columns:62px 1fr 88px 62px;gap:8px;align-items:center;padding:5px 3px 7px}
.control-btn{height:58px;border-radius:50%;background:linear-gradient(180deg,#4c3b60,#171326);border:2px solid #a87931;color:#ffd84a;font-size:25px;box-shadow:0 4px 8px rgba(0,0,0,.5)}
.bet-box{height:58px;border-radius:13px;background:rgba(0,0,0,.48);border:1px solid rgba(255,213,74,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.bet-label{font-size:11px;color:#bcb7c5}.bet-value{font-size:17px;font-weight:900;color:#fff}
.bet-buttons{display:flex;gap:5px;margin-top:2px}
.bet-buttons button{padding:2px 7px;border-radius:8px;background:#29243a;color:#ffd85a;font-size:10px;font-weight:800}
.spin{width:88px;height:88px;margin-top:-25px;border-radius:50%;background:radial-gradient(circle at 38% 28%,#fff8bd 0 8%,#ffd94d 20%,#f0a800 55%,#a94900 100%);border:5px solid #ffe36b;box-shadow:0 0 0 4px #7e3800,0 7px 18px rgba(0,0,0,.65),0 0 25px rgba(255,182,0,.35);color:#7c3700;font-family:Georgia,serif;font-size:20px;font-weight:900}
.spin:active{transform:scale(.95)}.spin:disabled{filter:grayscale(.6);opacity:.6}
.balance{text-align:center;height:37px;font-size:12px;color:#aaa5b7}.balance b{font-size:20px;color:#fff;margin-left:6px}
.status{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:11px;color:#8f8ba0;white-space:nowrap}
.bet-modal{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:30;display:none;align-items:flex-end}.bet-modal.open{display:flex}
.modal-box{width:100%;padding:18px 16px 24px;background:linear-gradient(180deg,#19152d,#090a19);border-top:2px solid #b07a25;border-radius:22px 22px 0 0}
.modal-title{text-align:center;color:#ffd95b;font-weight:900;margin-bottom:14px}.bet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bet-grid button{padding:12px 5px;border-radius:10px;background:#242036;color:#fff;border:1px solid #4a405f;font-weight:900}.bet-grid button.selected{background:#b8780a;border-color:#ffe16b}
.toast{position:absolute;left:50%;top:74px;transform:translateX(-50%) translateY(-15px);background:rgba(15,13,28,.94);border:1px solid #b27a2d;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:20;font-weight:900}.loading.show{display:flex}
.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);border-top-color:#ffd84a;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-height:700px){.topbar{height:55px}.main{height:calc(100% - 55px)}.multiplier-title{font-size:30px;margin:0}.multiplier-bar{height:49px;margin-bottom:7px}.mult{height:35px;font-size:21px}.result{height:40px}.controls{padding-top:0}.spin{width:76px;height:76px;font-size:17px}.control-btn{height:50px}.bet-box{height:50px}.balance{height:30px}}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">RSK32</div>
  <div class="top-title">SUPER ACE</div>
  <button class="icon-btn sound-on" id="soundBtn">🔊</button>
</header>

<main class="main">
<div class="wood"></div>
<section class="game-area">
  <div class="multiplier-title">Super Ace</div>
  <div class="multiplier-bar" id="multiplierBar">
    <div class="mult active" data-mult="1">×1</div><div class="mult" data-mult="2">×2</div>
    <div class="mult" data-mult="3">×3</div><div class="mult" data-mult="5">×5</div>
  </div>

  <div class="reel-frame"><div class="reels" id="reels"></div></div>

  <div class="result"><span class="win-label">WIN</span><strong id="winAmount">0.00</strong></div>

  <div class="controls">
    <button class="control-btn" id="betMinus">−</button>
    <div class="bet-box">
      <div class="bet-label">BET</div>
      <div class="bet-value">৳ <span id="betValue">5.00</span></div>
      <div class="bet-buttons"><button id="betOpen">CHANGE</button><button id="maxBet">MAX</button></div>
    </div>
    <button class="spin" id="spinBtn">SPIN</button>
    <button class="control-btn" id="betPlus">+</button>
  </div>

  <div class="balance">Balance <b>৳ <span id="balanceValue">0.00</span></b></div>
  <div class="status" id="statusText">Connecting...</div>
</section>

<div class="bet-modal" id="betModal">
  <div class="modal-box">
    <div class="modal-title">SELECT BET</div>
    <div class="bet-grid" id="betGrid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spinner"></div></div>
</main>
</div>

<script>
/* =========================
   RSK32 SUPER ACE
   Backend: Render API
   ========================= */
const API_URL = "https://casinoplatform.onrender.com";
const TOKEN_KEY = "token";
const GAME_NAME = "super-ace";

const BETS = [1,2,5,10,20,50,100,200,500,1000];
let betIndex = 2;
let balance = 0;
let spinning = false;
let soundEnabled = true;
let audioCtx = null;

const SYMBOLS = [
  {v:"A", cls:"ace", weight:16},
  {v:"K", cls:"gold", weight:18},
  {v:"Q", cls:"red", weight:18},
  {v:"J", cls:"ace", weight:20},
  {v:"10",cls:"red", weight:15},
  {v:"♠", cls:"ace", weight:9},
  {v:"★", cls:"wild", weight:4}
];

const reelsEl = document.getElementById("reels");
const betValueEl = document.getElementById("betValue");
const balanceEl = document.getElementById("balanceValue");
const winEl = document.getElementById("winAmount");
const statusEl = document.getElementById("statusText");
const spinBtn = document.getElementById("spinBtn");
const loading = document.getElementById("loading");
const toastEl = document.getElementById("toast");
const betModal = document.getElementById("betModal");

function token(){
  return localStorage.getItem(TOKEN_KEY) || localStorage.getItem("auth_token") || "";
}
function money(n){ return Number(n||0).toFixed(2); }

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(()=>toastEl.classList.remove("show"),2200);
}

function setLoading(v){ loading.classList.toggle("show",v); }

function weightedSymbol(){
  const total = SYMBOLS.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*total;
  for(const x of SYMBOLS){ r-=x.weight; if(r<=0) return x; }
  return SYMBOLS[0];
}

function createReels(matrix=null){
  reelsEl.innerHTML="";
  for(let c=0;c<4;c++){
    const reel=document.createElement("div");
    reel.className="reel";
    for(let r=0;r<4;r++){
      const s = matrix ? matrix[r][c] : weightedSymbol();
      const cell=document.createElement("div");
      cell.className="symbol "+s.cls;
      cell.dataset.symbol=s.v;
      cell.textContent=s.v;
      reel.appendChild(cell);
    }
    reelsEl.appendChild(reel);
  }
}

function currentMatrix(){
  const m=[];
  for(let r=0;r<4;r++){
    m[r]=[];
    for(let c=0;c<4;c++){
      const cell=reelsEl.children[c].children[r];
      const s=SYMBOLS.find(x=>x.v===cell.dataset.symbol) || SYMBOLS[0];
      m[r][c]=s;
    }
  }
  return m;
}

/* Local demo-style paytable.
   The final money result is still taken from the server response
   when the backend provides one. */
function calculateLocalResult(matrix, stake){
  let win=0;
  const counts={};
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const v=matrix[r][c].v;
      if(v!=="★") counts[v]=(counts[v]||0)+1;
    }
  }
  let bestSymbol=null,bestCount=0;
  Object.keys(counts).forEach(v=>{if(counts[v]>bestCount){bestCount=counts[v];bestSymbol=v;}});
  if(bestCount>=4) win=stake*8;
  else if(bestCount>=3) win=stake*2;
  else if(bestCount>=2) win=stake*.2;

  /* Small chance for a full wild bonus in demo visuals */
  const wilds=matrix.flat().filter(x=>x.v==="★").length;
  if(wilds>=3) win=Math.max(win,stake*5);

  return {win:Math.round(win*100)/100,bestSymbol,bestCount};
}

function highlightWins(matrix,bestSymbol){
  if(!bestSymbol) return;
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      if(matrix[r][c].v===bestSymbol || matrix[r][c].v==="★"){
        reelsEl.children[c].children[r].classList.add("win");
      }
    }
  }
}

function setMultiplier(win,stake){
  let mult=1;
  if(win>=stake*5) mult=5;
  else if(win>=stake*3) mult=3;
  else if(win>=stake*2) mult=2;
  document.querySelectorAll(".mult").forEach(x=>x.classList.toggle("active",Number(x.dataset.mult)===mult));
}

function beep(freq=440,duration=.08,type="sine"){
  if(!soundEnabled) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=.035;
    o.connect(g);g.connect(audioCtx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

async function api(path,options={}){
  const headers={"Content-Type":"application/json",...(options.headers||{})};
  const t=token();
  if(t) headers.Authorization="Bearer "+t;
  const res=await fetch(API_URL+path,{...options,headers});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.message||data.error||"Server error");
  return data;
}

async function loadBalance(){
  if(!token()){
    balance=0; balanceEl.textContent=money(balance);
    statusEl.textContent="Login required";
    return;
  }
  try{
    const data=await api("/api/me");
    const u=data.user||data;
    balance=Number(u.balance ?? data.balance ?? 0);
    balanceEl.textContent=money(balance);
    statusEl.textContent="Ready to spin";
  }catch(e){
    statusEl.textContent="Could not load balance";
    showToast(e.message||"Login required");
  }
}

async function serverBet(stake){
  /*
    Expected backend:
    POST /api/bet
    Authorization: Bearer <token>
    { game:"super-ace", amount:<stake> }

    The code accepts several common response field names.
  */
  const data=await api("/api/bet",{
    method:"POST",
    body:JSON.stringify({game:GAME_NAME,amount:stake,bet_amount:stake})
  });
  const newBalance =
    data.balance ??
    data.user?.balance ??
    data.data?.balance ??
    null;
  const win =
    data.win ??
    data.win_amount ??
    data.payout ??
    data.data?.win ??
    null;

  return {
    balance:newBalance===null?null:Number(newBalance),
    win:win===null?null:Number(win),
    raw:data
  };
}

async function spin(){
  if(spinning) return;
  if(!token()){ showToast("Please login first"); statusEl.textContent="Login required"; return; }

  const stake=BETS[betIndex];
  if(balance < stake){ showToast("Insufficient balance"); return; }

  spinning=true; spinBtn.disabled=true; setLoading(false);
  winEl.textContent="0.00";
  document.querySelectorAll(".symbol").forEach(x=>x.classList.remove("win"));
  statusEl.textContent="Spinning...";
  beep(240,.08,"sawtooth");

  /* Optimistic visual reel animation only. Server controls balance/result. */
  reelsEl.classList.add("spinning");
  const interval=setInterval(()=>createReels(),90);

  try{
    const server=await serverBet(stake);
    clearInterval(interval);

    const matrix=[];
    for(let r=0;r<4;r++){matrix[r]=[];for(let c=0;c<4;c++)matrix[r][c]=weightedSymbol();}
    createReels(matrix);

    /* Prefer server payout when provided. */
    const local=calculateLocalResult(matrix,stake);
    const win=server.win===null ? local.win : Math.max(0,server.win);

    balance = server.balance===null ? Math.max(0,balance-stake+win) : server.balance;
    balanceEl.textContent=money(balance);
    winEl.textContent=money(win);
    setMultiplier(win,stake);

    if(win>0){
      highlightWins(matrix,local.bestSymbol);
      statusEl.textContent="WIN! Congratulations";
      beep(660,.10,"triangle"); setTimeout(()=>beep(880,.16,"triangle"),110);
    }else{
      statusEl.textContent="Good luck next spin";
      beep(180,.10,"sine");
    }
  }catch(e){
    clearInterval(interval);
    statusEl.textContent="Spin failed";
    showToast(e.message||"Bet request failed");
  }finally{
    reelsEl.classList.remove("spinning");
    spinning=false;spinBtn.disabled=false;
  }
}

function renderBetGrid(){
  const grid=document.getElementById("betGrid");
  grid.innerHTML="";
  BETS.forEach((v,i)=>{
    const b=document.createElement("button");
    b.textContent="৳ "+v;
    b.className=i===betIndex?"selected":"";
    b.onclick=()=>{betIndex=i;updateBet();betModal.classList.remove("open");};
    grid.appendChild(b);
  });
}
function updateBet(){
  betValueEl.textContent=money(BETS[betIndex]);
  renderBetGrid();
}

document.getElementById("betMinus").onclick=()=>{if(betIndex>0){betIndex--;updateBet()}};
document.getElementById("betPlus").onclick=()=>{if(betIndex<BETS.length-1){betIndex++;updateBet()}};
document.getElementById("betOpen").onclick=()=>{renderBetGrid();betModal.classList.add("open")};
document.getElementById("maxBet").onclick=()=>{betIndex=BETS.length-1;updateBet()};
betModal.addEventListener("click",e=>{if(e.target===betModal)betModal.classList.remove("open")});
spinBtn.onclick=spin;

document.getElementById("soundBtn").onclick=()=>{
  soundEnabled=!soundEnabled;
  document.getElementById("soundBtn").textContent=soundEnabled?"🔊":"🔇";
  if(soundEnabled) beep(520,.07);
};

createReels();
updateBet();
loadBalance();
</script>
</body>
</html>
