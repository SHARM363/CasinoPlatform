<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSK32 Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Game List */
        .game-list-section {
            margin-top: 20px;
            display: none;
        }

        .game-list-section h3 {
            margin-bottom: 15px;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: 0.2s;
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .game-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .game-name {
            font-weight: bold;
        }

        .back-game-btn {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">

        <div class="logo">
            RSK32
        </div>

        <div class="header-right">

            <div class="balance-box">
                💰 <span id="balance">৳0.00</span>
            </div>

            <button id="refreshBtn" class="icon-btn">🔄</button>

            <button id="notificationBtn" class="icon-btn">🔔</button>

        </div>

    </div>


    <div class="welcome-card">

        <h2>
            Welcome,
            <span id="username">Loading...</span>
        </h2>

        <p>
            User ID:
            <span id="userId">Loading...</span>
        </p>

    </div>


    <!-- Banner Slider -->

    <div class="banner-slider">

        <div class="slides fade">
            <img src="images/banner1.jpg" alt="Banner 1">
        </div>

        <div class="slides fade">
            <img src="images/banner2.jpg" alt="Banner 2">
        </div>

        <div class="slides fade">
            <img src="images/banner3.jpg" alt="Banner 3">
        </div>

    </div>


    <!-- Quick Actions -->

    <div class="quick-actions">

        <a href="deposit.html" class="action-card">
            💰
            <span>Deposit</span>
        </a>

        <a href="withdraw.html" class="action-card">
            💸
            <span>Withdraw</span>
        </a>

        <a href="#" class="action-card">
            🎁
            <span>Reward</span>
        </a>

        <a href="#" class="action-card">
            💎
            <span>VIP</span>
        </a>

    </div>


    <!-- Game Categories -->

    <div class="game-section" id="gameCategories">

        <h3>🎮 Game Categories</h3>

        <div class="game-grid">

            <div class="game-item" onclick="openCategory('slots')">
                🎰
                <br>
                Slots
            </div>

            <div class="game-item" onclick="openCategory('live')">
                🎲
                <br>
                Live
            </div>

            <div class="game-item" onclick="openCategory('sports')">
                ⚽
                <br>
                Sports
            </div>

            <div class="game-item" onclick="openCategory('poker')">
                🃏
                <br>
                Poker
            </div>

        </div>

    </div>


    <!-- Game List -->

    <div class="game-list-section" id="gameListSection">

        <h3 id="gameListTitle">🎮 Games</h3>

        <div class="game-list" id="gameList"></div>

        <button class="back-game-btn" onclick="showCategories()">
            ← Back to Categories
        </button>

    </div>


    <button id="logoutBtn" class="main-btn">
        Logout
    </button>


    <!-- Bottom Navigation -->

    <div class="bottom-nav">

        <a href="dashboard.html" class="nav-item active">
            👋
            <span>Home</span>
        </a>

        <a href="referral.html" class="nav-item">
            👥
            <span>Referral</span>
        </a>

        <a href="promotion.html" class="nav-item">
            🎁
            <span>Promotion</span>
        </a>

        <a href="service.html" class="nav-item">
            💬
            <span>Service</span>
        </a>

        <a href="profile.html" class="nav-item">
            👤
            <span>Member</span>
        </a>

    </div>

</div>


<script>

    const token = localStorage.getItem("token");

    // If user is not logged in
    if (!token) {
        window.location.href = "index.html";
    }


    const username = document.getElementById("username");
    const userId = document.getElementById("userId");
    const balance = document.getElementById("balance");
    const logoutBtn = document.getElementById("logoutBtn");


    // =========================
    // LOAD USER DATA
    // =========================

    async function loadUserData() {

        try {

            console.log("Calling /api/me with token:", token);

            const response = await fetch(
                "https://casinoplatform.onrender.com/api/me",
                {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            if (data.success) {

                username.textContent =
                    data.user.username || "User";

                userId.textContent =
                    data.user.id || "N/A";

                balance.textContent =
                    "৳" + Number(data.user.balance || 0).toFixed(2);

            } else {

                alert(data.message || "Unable to load account.");

                localStorage.removeItem("token");

                window.location.href = "index.html";
            }

        } catch (error) {

            console.error("Account error:", error);

            balance.textContent = "৳0.00";

        }
    }


    // =========================
    // GAME DATA
    // =========================

    const games = {

        slots: [
            {
                name: "Lucky Slots",
                icon: "🎰"
            },
            {
                name: "Fruit Slots",
                icon: "🍒"
            },
            {
                name: "Mega Slots",
                icon: "💰"
            }
        ],

        live: [
            {
                name: "Live Casino",
                icon: "🎲"
            },
            {
                name: "Roulette",
                icon: "🎡"
            },
            {
                name: "Blackjack",
                icon: "🃏"
            }
        ],

        sports: [
            {
                name: "Football",
                icon: "⚽"
            },
            {
                name: "Cricket",
                icon: "🏏"
            },
            {
                name: "Basketball",
                icon: "🏀"
            }
        ],

        poker: [
            {
                name: "Classic Poker",
                icon: "🃏"
            },
            {
                name: "Texas Poker",
                icon: "♠️"
            },
            {
                name: "Poker Table",
                icon: "🎴"
            }
        ]

    };


    // =========================
    // OPEN CATEGORY
    // =========================

    function openCategory(category) {

        const categories =
            document.getElementById("gameCategories");

        const gameListSection =
            document.getElementById("gameListSection");

        const gameList =
            document.getElementById("gameList");

        const gameListTitle =
            document.getElementById("gameListTitle");


        categories.style.display = "none";

        gameListSection.style.display = "block";

        gameList.innerHTML = "";


        let title = "🎮 Games";


        if (category === "slots") {
            title = "🎰 Slots Games";
        }

        if (category === "live") {
            title = "🎲 Live Games";
        }

        if (category === "sports") {
            title = "⚽ Sports Games";
        }

        if (category === "poker") {
            title = "🃏 Poker Games";
        }


        gameListTitle.textContent = title;


        const selectedGames = games[category] || [];


        selectedGames.forEach(function(game) {

            const gameCard =
                document.createElement("div");

            gameCard.className = "game-card";

            gameCard.innerHTML = `
                <div class="game-icon">
                    ${game.icon}
                </div>

                <div class="game-name">
                    ${game.name}
                </div>
            `;


            gameCard.onclick = function() {

                openGame(game.name);

            };


            gameList.appendChild(gameCard);

        });

    }


    // =========================
    // BACK TO CATEGORIES
    // =========================

    function showCategories() {

        document.getElementById("gameCategories")
            .style.display = "block";

        document.getElementById("gameListSection")
            .style.display = "none";

    }


    // =========================
    // OPEN GAME
    // =========================

    function openGame(gameName) {

        alert(
            gameName +
            " selected.\n\nGame screen will be added next."
        );

    }


    // =========================
    // LOGOUT
    // =========================

    logoutBtn.onclick = function () {

        localStorage.removeItem("token");

        window.location.href = "index.html";

    };


    // =========================
    // BANNER SLIDER
    // =========================

    let slideIndex = 0;

    showSlides();


    function showSlides() {

        let slides =
            document.getElementsByClassName("slides");


        for (let i = 0; i < slides.length; i++) {

            slides[i].style.display = "none";

        }


        slideIndex++;


        if (slideIndex > slides.length) {

            slideIndex = 1;

        }


        slides[slideIndex - 1].style.display =
            "block";


        setTimeout(showSlides, 3000);

    }


    // =========================
    // LOAD USER
    // =========================

    loadUserData();

</script>

</body>
</html>
