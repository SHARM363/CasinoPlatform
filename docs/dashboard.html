<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSK32 Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            RSK32
        </div>

        <h1>Welcome to RSK32</h1>

        <p class="subtitle">
            You are successfully logged in.
        </p>

        <div class="profile-card">

            <div class="profile-title">
                👤 My Profile
            </div>

            <div class="profile-row">
                <span>Username</span>
                <strong id="username">Loading...</strong>
            </div>

            <div class="profile-row">
                <span>User ID</span>
                <strong id="userId">Loading...</strong>
            </div>

            <div class="profile-row">
                <span>Balance</span>
                <strong id="balance">৳0.00</strong>
            </div>

        </div>

        <button id="logoutBtn" class="main-btn">
            Logout
        </button>

    </div>

    <script>
    alert("Dashboard script is running"); 
    const token = localStorage.getItem("token");

    // If user is not logged in
    if (!token) {
        window.location.href = "index.html";
    }

    const username = document.getElementById("username");
    const userId = document.getElementById("userId");
    const balance = document.getElementById("balance");
    const logoutBtn = document.getElementById("logoutBtn");

    async function loadUserData() {

        try {

            console.log("Calling /api/me with token:", token);

const response = await fetch(
    "https://casinoplatform.onrender.com/api/me",
    {
        method: "GET",
        headers: {
            "Authorization": "Bearer " + token
        }
    }
);
            const data = await response.json();

            if (data.success) {

                username.textContent =
                    data.user.username || "User";

                userId.textContent =
                    data.user.id || "N/A";

                balance.textContent =
                    "৳" + Number(data.user.balance || 0).toFixed(2);

            } else {

                alert(data.message || "Unable to load account.");

                localStorage.removeItem("token");

                window.location.href = "index.html";
            }

        } catch (error) {

            console.error("Account error:", error);

            balance.textContent = "৳0.00";

        }
    }

    // Load user data
    loadUserData();
<div class="action-buttons"><a href="deposit.html">
    <button class="main-btn deposit-btn">
        💰 Deposit
    </button>
</a>

<a href="withdraw.html">
    <button class="main-btn withdraw-btn">
        💸 Withdraw
    </button>
</a>

</div>

    // Logout
    logoutBtn.onclick = function () {
        localStorage.removeItem("token");

        window.location.href = "index.html";

    };

</script>
</body>
</html>
