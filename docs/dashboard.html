<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSK32 Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<body>

<div class="container">

    <div class="top-bar">

        <div class="logo">
            RSK32
        </div>

        <div class="header-right">

            <div class="balance-box">
                💰 <span id="balance">৳0.00</span>
            </div>

            <button id="refreshBtn" class="icon-btn">🔄</button>

            <button id="notificationBtn" class="icon-btn">🔔</button>

        </div>

    </div>

    <div class="welcome-card">

        <h2>
            Welcome,
            <span id="username">Loading...</span>
        </h2>

        <p>
            User ID:
            <span id="userId">Loading...</span>
        </p>

    </div>
<div class="banner-slider">

    <div class="banner">
        🎉 Welcome Bonus 100%
    </div>

</div>

<div class="quick-actions">

    <a href="deposit.html" class="action-card">
        💰
        <span>Deposit</span>
    </a>

    <a href="withdraw.html" class="action-card">
        💸
        <span>Withdraw</span>
    </a>

    <a href="#" class="action-card">
        🎁
        <span>Reward</span>
    </a>

    <a href="#" class="action-card">
        💎
        <span>VIP</span>
    </a>

</div> <!-- quick-actions এখানেই বন্ধ হবে -->

<div class="game-section">

    <h3>🎮 Game Categories</h3>

    <div class="game-grid">

        <div class="game-item">🎰<br>Slots</div>

        <div class="game-item">🎲<br>Live</div>

        <div class="game-item">⚽<br>Sports</div>

        <div class="game-item">🃏<br>Poker</div>

    </div>

</div>

<button id="logoutBtn" class="main-btn">
    Logout
</button>

</div>

    <script>
    alert("Dashboard script is running"); 
    const token = localStorage.getItem("token");

    // If user is not logged in
    if (!token) {
        window.location.href = "index.html";
    }

    const username = document.getElementById("username");
    const userId = document.getElementById("userId");
    const balance = document.getElementById("balance");
    const logoutBtn = document.getElementById("logoutBtn");

    async function loadUserData() {

        try {

            console.log("Calling /api/me with token:", token);

const response = await fetch(
    "https://casinoplatform.onrender.com/api/me",
    {
        method: "GET",
        headers: {
            "Authorization": "Bearer " + token
        }
    }
);
            const data = await response.json();

            if (data.success) {

                username.textContent =
                    data.user.username || "User";

                userId.textContent =
                    data.user.id || "N/A";

                balance.textContent =
                    "৳" + Number(data.user.balance || 0).toFixed(2);

            } else {

                alert(data.message || "Unable to load account.");

                localStorage.removeItem("token");

                window.location.href = "index.html";
            }

        } catch (error) {

            console.error("Account error:", error);

            balance.textContent = "৳0.00";

        }
    }

    // Logout
    logoutBtn.onclick = function () {
        localStorage.removeItem("token");

        window.location.href = "index.html";
    };
</script>
    <div class="action-buttons"><a href="deposit.html">
    <button class="main-btn deposit-btn">
        💰 Deposit
    </button>
</a>

<a href="withdraw.html">
    <button class="main-btn withdraw-btn">
        💸 Withdraw
    </button>
</a>
</div>
</body>
</html>
