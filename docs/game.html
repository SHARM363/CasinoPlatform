<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RSK32 Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10121a;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 15px;
}

/* =========================
   TOP BAR
========================= */

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.back-btn {
    border: none;
    background: #252938;
    color: white;
    padding: 11px 15px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.balance-box {
    background: #252938;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

/* =========================
   GAME BOX
========================= */

.game-box {
    background: #1d2030;
    border: 1px solid #2c3040;
    border-radius: 18px;
    padding: 25px 18px;
    text-align: center;
}

/* =========================
   LIVE ACCOUNT BADGE
========================= */

.real-account {
    display: inline-block;
    background: #2ecc71;
    color: #ffffff;
    padding: 7px 15px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
}

.game-icon {
    font-size: 60px;
    margin: 8px 0;
}

.game-name {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 18px;
}

/* =========================
   REAL BALANCE
========================= */

.real-balance-box {
    background: #252938;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
}

.real-balance-label {
    color: #aeb2c0;
    font-size: 13px;
}

.real-balance {
    font-size: 24px;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================
   SLOT MACHINE
========================= */

.slot-machine {
    background: #11131d;
    border: 2px solid #34384b;
    border-radius: 15px;
    padding: 18px 10px;
    margin-top: 10px;
}

.slot-title {
    font-size: 14px;
    color: #aeb2c0;
    margin-bottom: 12px;
}

.slots {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.reel {
    width: 78px;
    height: 82px;
    background: #f5f5f5;
    color: #111;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 43px;
    border: 3px solid #555b70;
}

.reel.spinning {
    animation: spinEffect 0.12s infinite;
}

@keyframes spinEffect {

    0% {
        transform: translateY(-4px);
    }

    50% {
        transform: translateY(4px);
    }

    100% {
        transform: translateY(-4px);
    }

}

/* =========================
   BET AREA
========================= */

.bet-area {
    margin-top: 18px;
}

.bet-label {
    color: #aeb2c0;
    font-size: 13px;
    margin-bottom: 8px;
}

.bet-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.bet-btn {
    border: none;
    background: #303446;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.bet-btn.active {
    background: #4b516a;
}

.spin-btn {
    width: 100%;
    margin-top: 18px;
    border: none;
    background: #ffffff;
    color: #11131d;
    padding: 14px;
    border-radius: 11px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* =========================
   RESULT
========================= */

.result-box {
    margin-top: 15px;
    min-height: 42px;
    background: #252938;
    border-radius: 10px;
    padding: 12px;
    color: #d7dae3;
    font-size: 14px;
}

.result-win {
    color: #ffffff;
    font-weight: bold;
}

/* =========================
   INFO
========================= */

.info-box {
    margin-top: 15px;
    background: #1d2030;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    color: #aeb2c0;
    font-size: 13px;
    line-height: 1.5;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .logo {
        font-size: 21px;
    }

    .game-name {
        font-size: 23px;
    }

    .balance-box {
        font-size: 12px;
        padding: 8px;
    }

    .reel {
        width: 68px;
        height: 72px;
        font-size: 36px;
    }

}

</style>

</head>

<body>

<div class="container">
      <!-- =========================
     TOP BAR
========================= -->

<div class="top-bar">

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back

    </button>

    <div class="logo">
        RSK32
    </div>

    <div class="balance-box">

        💰 ৳<span id="balance">0.00</span>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div class="game-box">

    <div class="real-account">
        REAL GAME
    </div>

    <div
        class="game-icon"
        id="gameIcon">

        🎮

    </div>

    <div
        class="game-name"
        id="gameName">

        Loading...

    </div>


    <!-- REAL BALANCE -->

    <div class="real-balance-box">

        <div class="real-balance-label">
            Real Balance
        </div>

        <div class="real-balance">
            ৳<span id="realBalance">0.00</span>
        </div>

    </div>


    <!-- =========================
         SLOT MACHINE
    ========================= -->

    <div class="slot-machine">

        <div class="slot-title">
            🎰 Lucky Slots Real
        </div>

        <div class="slots">

            <div
                class="reel"
                id="reel1">
                🍒
            </div>

            <div
                class="reel"
                id="reel2">
                🍋
            </div>

            <div
                class="reel"
                id="reel3">
                🍊
            </div>

        </div>


        <!-- BET -->

        <div class="bet-area">

            <div class="bet-label">
                Bet Amount
            </div>

            <div class="bet-buttons">

                <button
                    class="bet-btn active"
                    onclick="selectBet(10, this)">
                    ৳10
                </button>

                <button
                    class="bet-btn"
                    onclick="selectBet(50, this)">
                    ৳50
                </button>

                <button
                    class="bet-btn"
                    onclick="selectBet(100, this)">
                    ৳100
                </button>

                <button
                    class="bet-btn"
                    onclick="selectBet(500, this)">
                    ৳500
                </button>

            </div>


            <button
                class="spin-btn"
                id="spinBtn"
                onclick="spinSlots()">

                🎰 SPIN

            </button>

        </div>


        <!-- RESULT -->

        <div
            class="result-box"
            id="result">

            Choose a bet and press SPIN.

        </div>

    </div>

</div>


<!-- =========================
     INFO
========================= -->

<div class="info-box">

    🎮 Live Game

    <br>

    This game uses your real balance.

    <br>

    Your real account balance will be changed based on results.

</div>
<script>

    // =========================
    // API
    // =========================

    const API_URL =
        "https://casinoplatform.onrender.com";


    // =========================
    // REAL GAME DATA
    // =========================

    const gameIcons = {

        "Lucky Slots": "🎰",
        "Fruit Mania": "🍒",
        "Diamond Spin": "💎",
        "Super Star": "⭐",
        "Fire Spin": "🔥",
        "Mega Jackpot": "💰",

        "Live Roulette": "🎡",
        "Live Blackjack": "🃏",
        "Live Baccarat": "🎯",
        "Live Dice": "🎲",

        "Football": "⚽",
        "Cricket": "🏏",
        "Basketball": "🏀",
        "Tennis": "🎾",

        "Texas Hold'em": "♠️",
        "Classic Poker": "🃏",

        "Rocket Crash": "🚀",
        "Multiplier Crash": "💥",

        "Target Master": "🎯",
        "Bowling": "🎳",
        "Arcade Rush": "🕹️",

        "Classic Roulette": "🎡",
        "European Roulette": "🔴",

        "Lucky Dice": "🎲",
        "Lucky Target": "🎯",
        "Coin Flip": "🪙"

    };


    // =========================
    // SLOT SYMBOLS
    // =========================

    const slotSymbols = [

        "🍒",
        "🍋",
        "🍊",
        "🍇",
        "⭐",
        "💎",
        "7️⃣"

    ];


    // =========================
    // REAL SETTINGS
    // =========================

    let selectedBet = 10;

    let spinning = false;


    // =========================
    // LOAD GAME
    // =========================

    function loadGame() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const game =
            params.get("game");


        if (game) {

            document.getElementById(
                "gameName"
            ).textContent =
                game;


            document.getElementById(
                "gameIcon"
            ).textContent =
                gameIcons[game] || "🎮";

        } else {

            document.getElementById(
                "gameName"
            ).textContent =
                "Real Game";

        }

    }


    // =========================
    // LOAD REAL BALANCE
    // =========================

    async function loadBalance() {

        const token =
            localStorage.getItem(
                "token"
            );


        if (!token) {

            window.location.href =
                "index.html";

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/me`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Account request failed"
                );

            }


            const data =
                await response.json();


            if (
                data.success &&
                data.user
            ) {

                const balance =
                    Number(
                        data.user.balance || 0
                    ).toFixed(2);


                document.getElementById(
                    "balance"
                ).textContent =
                    balance;


                // Update Real Balance Box Display
                if (document.getElementById("realBalance")) {
                    document.getElementById(
                        "realBalance"
                    ).textContent =
                        balance;
                }

            }

        } catch (error) {

            console.error(
                "Balance error:",
                error
            );

        }

    }


    // =========================
    // SELECT BET DISPLAY
    // =========================

    function selectBet(amount, button) {

        selectedBet = amount;


        const buttons =
            document.querySelectorAll(
                ".bet-btn"
            );


        buttons.forEach(function(btn) {

            btn.classList.remove(
                "active"
            );

        });


        button.classList.add(
            "active"
        );


        document.getElementById(
            "result"
        ).textContent =
            "Bet selected: ৳" +
            amount +
            ". Press SPIN to start.";

    }


    // =========================
    // SLOT SPIN (REAL ACCOUNT)
    // =========================

    function spinSlots() {

        if (spinning) {
            return;
        }


        spinning = true;


        const spinButton =
            document.getElementById(
                "spinBtn"
            );


        spinButton.disabled =
            true;


        document.getElementById(
            "result"
        ).textContent =
            "🎰 Spinning...";


        const reels = [

            document.getElementById(
                "reel1"
            ),

            document.getElementById(
                "reel2"
            ),

            document.getElementById(
                "reel3"
            )

        ];


        reels.forEach(function(reel) {

            reel.classList.add(
                "spinning"
            );

        });


        let counter = 0;


        const animation =
            setInterval(function() {

                reels.forEach(
                    function(reel) {

                        const randomIndex =
                            Math.floor(
                                Math.random() *
                                slotSymbols.length
                            );


                        reel.textContent =
                            slotSymbols[
                                randomIndex
                            ];

                    }
                );


                counter++;


                if (counter >= 20) {

                    clearInterval(
                        animation
                    );


                    reels.forEach(
                        function(reel) {

                            reel.classList.remove(
                                "spinning"
                            );

                        }
                    );


                    // Live game calculation placeholder
                    document.getElementById(
                        "result"
                    ).innerHTML =
                        "🎮 Spin completed.<br>" +
                        "Bet amount: ৳" +
                        selectedBet;


                    spinButton.disabled =
                        false;


                    spinning = false;

                }

            }, 100);

    }


    // =========================
    // BACK
    // =========================

    function goBack() {

        window.location.href =
            "games.html";

    }


    // =========================
    // START
    // =========================

 loadGame();

 loadBalance();
      
 </script>
 </body>
 </html>
