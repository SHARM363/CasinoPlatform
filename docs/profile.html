<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RSK32 - Member</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f5f9;
            color: #222;
            padding-bottom: 80px;
        }

        .header {
            height: 60px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #ddd;
        }

        .back-btn {
            font-size: 24px;
            text-decoration: none;
            color: #222;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
        }

        .profile-card {
            background: #ffffff;
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .avatar {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        .username {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .email {
            margin-top: 5px;
            color: #777;
            font-size: 14px;
        }

        .user-id {
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }

        .balance-box {
            margin-top: 15px;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
        }

        .balance-label {
            font-size: 13px;
            color: #777;
        }

        .balance {
            font-size: 27px;
            font-weight: bold;
            margin-top: 5px;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .main-btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .section {
            margin: 15px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .menu-card {
            background: white;
            border-radius: 13px;
            overflow: hidden;
            box-shadow: 0 2px 7px rgba(0,0,0,0.06);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 17px 15px;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: #222;
            cursor: pointer;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-icon {
            width: 35px;
            height: 35px;
            border-radius: 9px;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .arrow {
            color: #999;
            font-size: 20px;
        }

        .logout {
            margin: 15px;
        }

        .logout-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #e74c3c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Bet History */

        #betHistorySection {
            display: none;
        }

        .history-card {
            background: white;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.06);
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .history-row:last-child {
            margin-bottom: 0;
        }

        .history-label {
            color: #777;
        }

        .history-value {
            font-weight: bold;
        }

        .win {
            color: green;
        }

        .loss {
            color: red;
        }

        .empty-history {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            color: #777;
        }

        /* Bottom Navigation */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: #777;
            text-align: center;
            font-size: 11px;
        }

        .nav-icon {
            display: block;
            font-size: 21px;
            margin-bottom: 3px;
        }

        .nav-item.active {
            color: #111;
            font-weight: bold;
        }

        @media (min-width: 700px) {
            body {
                max-width: 500px;
                margin: auto;
            }

            .bottom-nav {
                max-width: 500px;
                margin: auto;
            }
        }
    </style>
</head>

    </div>

    <div class="menu-card">

<script>

const API_URL =
    "https://casinoplatform.onrender.com";

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "index.html";

}


/* =========================
   LOAD USER
========================= */

async function loadUser() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/me`,
                {
                    method: "GET",
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();


        if (!data.success) {

            if (
                response.status === 401
            ) {

                logout();

            }

            return;

        }


        document.getElementById(
            "username"
        ).textContent =
            data.user.username || "User";


        document.getElementById(
            "email"
        ).textContent =
            data.user.email || "";


        document.getElementById(
            "userId"
        ).textContent =
            data.user.id;


        document.getElementById(
            "balance"
        ).textContent =
            "৳" +
            Number(
                data.user.balance
            ).toFixed(2);


    } catch (error) {

        console.error(
            "User loading error:",
            error
        );

    }

}


/* =========================
   BET HISTORY
========================= */

async function showBetHistory() {

    const section =
        document.getElementById(
            "betHistorySection"
        );

    section.style.display =
        "block";


    section.scrollIntoView({
        behavior: "smooth"
    });


    const history =
        document.getElementById(
            "betHistory"
        );


    history.innerHTML =
        "Loading...";


    try {

        const response =
            await fetch(
                `${API_URL}/api/bet-history`,
                {
                    method: "GET",
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            history.innerHTML =
                `<div class="empty-history">
                    Unable to load bet history.
                </div>`;

            return;

        }


        if (
            !data.bets ||
            data.bets.length === 0
        ) {

            history.innerHTML =
                `<div class="empty-history">
                    No bet history found.
                </div>`;

            return;

        }


        history.innerHTML =
            data.bets.map(
                bet => {

                    const winLoss =
                        Number(
                            bet.win_loss || 0
                        );


                    let resultClass =
                        "";

                    if (
                        winLoss > 0
                    ) {

                        resultClass =
                            "win";

                    } else if (
                        winLoss < 0
                    ) {

                        resultClass =
                            "loss";

                    }


                    return `

                        <div class="history-card">

                            <div class="history-row">

                                <span class="history-label">
                                    Bet ID
                                </span>

                                <span class="history-value">
                                    #${bet.id}
                                </span>

                            </div>


                            <div class="history-row">

                                <span class="history-label">
                                    Game
                                </span>

                                <span class="history-value">
                                    ${bet.game || "N/A"}
                                </span>

                            </div>


                            <div class="history-row">

                                <span class="history-label">
                                    Bet Amount
                                </span>

                                <span class="history-value">
                                    ৳${Number(
                                        bet.bet_amount
                                    ).toFixed(2)}
                                </span>

                            </div>


                            <div class="history-row">

                                <span class="history-label">
                                    Result
                                </span>

                                <span class="history-value">
                                    ${bet.result || "N/A"}
                                </span>

                            </div>


                            <div class="history-row">

                                <span class="history-label">
                                    Win / Loss
                                </span>

                                <span
                                    class="history-value ${resultClass}">
                                    ৳${winLoss.toFixed(2)}
                                </span>

                            </div>


                            <div class="history-row">

                                <span class="history-label">
                                    Date & Time
                                </span>

                                <span class="history-value">
                                    ${bet.created_at}
                                </span>

                            </div>

                        </div>

                    `;

                }
            ).join("");


    } catch (error) {

        console.error(
            "Bet history error:",
            error
        );


        history.innerHTML =
            `<div class="empty-history">
                Unable to connect to server.
            </div>`;

    }

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "token"
    );

    window.location.href =
        "index.html";

}


/* =========================
   START
========================= */

loadUser();

</script>
