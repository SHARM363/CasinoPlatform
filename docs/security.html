<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0">

    <title>RSK32 - Security Center</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                "Noto Sans Bengali",
                sans-serif;

            background: #f5f6f8;

            color: #222;

            min-height: 100vh;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            height: 58px;

            background: #ffffff;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding: 0 16px;

            border-bottom:
                1px solid #eeeeee;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .back-btn {

            border: none;

            background:
                transparent;

            font-size: 28px;

            cursor: pointer;

            color: #222;

            width: 40px;

        }


        .header-title {

            font-size: 18px;

            font-weight: 700;

        }


        .header-logo {

            font-size: 18px;

            font-weight: 800;

            color: #e60000;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 600px;

            margin: auto;

            padding: 14px;

            padding-bottom: 95px;

        }


        /* =========================
           SECURITY HEADER CARD
        ========================= */

        .security-card {

            background:
                linear-gradient(
                    135deg,
                    #171717,
                    #333333
                );

            color: #ffffff;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 16px;

            box-shadow:
                0 4px 14px
                rgba(0,0,0,0.10);

        }


        .security-title {

            font-size: 20px;

            font-weight: 700;

            margin-bottom: 16px;

        }


        .security-percent {

            font-size: 38px;

            font-weight: 800;

            line-height: 1;

            margin-bottom: 7px;

        }


        .security-level {

            font-size: 13px;

            color: #dddddd;

            margin-bottom: 18px;

        }


        .progress-bg {

            width: 100%;

            height: 8px;

            background:
                rgba(255,255,255,0.18);

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 18px;

        }


        .progress-bar {

            width: 100%;

            height: 100%;

            background: #ffffff;

            border-radius: 20px;

        }


        /* =========================
           LOGIN INFORMATION
        ========================= */

        .login-info {

            background:
                rgba(255,255,255,0.08);

            border-radius: 10px;

            padding: 12px;

        }


        .login-row {

            display: flex;

            justify-content:
                space-between;

            gap: 10px;

            padding: 8px 0;

            font-size: 12px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.10);

        }


        .login-row:last-child {

            border-bottom: none;

        }


        .login-label {

            color: #bbbbbb;

        }


        .login-value {

            color: #ffffff;

            font-weight: 700;

            text-align: right;

            word-break: break-word;

        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {

            font-size: 16px;

            font-weight: 700;

            margin: 20px 3px 10px;

        }


        /* =========================
           OPTION CARD
        ========================= */

        .option-card {

            background: #ffffff;

            border-radius: 14px;

            margin-bottom: 10px;

            overflow: hidden;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.05);

        }


        .option-item {

            width: 100%;

            min-height: 76px;

            padding: 14px;

            border: none;

            background: #ffffff;

            display: flex;

            align-items: center;

            text-align: left;

            cursor: pointer;

        }


        .option-item:active {

            background: #f7f7f7;

        }


        .option-icon {

            width: 46px;

            height: 46px;

            border-radius: 12px;

            background: #f1f1f1;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            flex-shrink: 0;

            margin-right: 13px;

        }


        .option-info {

            flex: 1;

            min-width: 0;

        }


        .option-title {

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .option-desc {

            font-size: 12px;

            color: #888888;

            line-height: 1.4;

        }


        .option-arrow {

            font-size: 25px;

            color: #999999;

            margin-left: 8px;

        }


        /* =========================
           PASSWORD MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.55);

            z-index: 500;

            align-items: flex-end;

            justify-content: center;

        }


        .modal.show {

            display: flex;

        }


        .modal-box {

            width: 100%;

            max-width: 600px;

            background: #ffffff;

            border-radius:
                18px 18px 0 0;

            padding: 20px;

            animation:
                slideUp .2s ease;

        }


        @keyframes slideUp {

            from {

                transform:
                    translateY(100%);

            }

            to {

                transform:
                    translateY(0);

            }

        }


        .modal-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 18px;

        }


        .modal-header h3 {

            font-size: 18px;

        }


        .close-btn {

            border: none;

            background:
                transparent;

            font-size: 26px;

            cursor: pointer;

        }


        .input-group {

            margin-bottom: 13px;

        }


        .input-group label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 6px;

        }


        .input-group input {

            width: 100%;

            height: 45px;

            border:
                1px solid #dddddd;

            border-radius: 9px;

            padding: 0 12px;

            outline: none;

            font-size: 14px;

        }


        .input-group input:focus {

            border-color:
                #e60000;

        }


        .password-btn {

            width: 100%;

            height: 44px;

            border: none;

            border-radius: 9px;

            background: #e60000;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

        }


        .password-btn:active {

            transform: scale(0.98);

        }


        .password-note {

            background: #fff8e8;

            color: #805d00;

            padding: 11px;

            border-radius: 9px;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 13px;

        }


        /* =========================
           LOGOUT
        ========================= */

        .logout-btn {

            width: 100%;

            height: 47px;

            margin-top: 18px;

            border: none;

            border-radius: 10px;

            background: #eeeeee;

            color: #d00000;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

        }


        .logout-btn:active {

            transform: scale(0.98);

        }


        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {

            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            height: 66px;

            background: #ffffff;

            border-top:
                1px solid #eeeeee;

            display: flex;

            justify-content:
                space-around;

            align-items: center;

            z-index: 200;

        }


        .nav-item {

            text-decoration: none;

            color: #777777;

            text-align: center;

            font-size: 11px;

        }


        .nav-icon {

            font-size: 20px;

            display: block;

            margin-bottom: 3px;

        }


        .nav-item.active {

            color: #e60000;

            font-weight: 700;

        }


        @media (max-width: 360px) {

            .security-percent {

                font-size: 34px;

            }

            .header-title {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <button
        class="back-btn"
        onclick="goBack()">

        ‹

    </button>


    <div class="header-title">

        সুরক্ষা কেন্দ্র

    </div>


    <div class="header-logo">

        RSK32

    </div>

</header>



<div class="container">


    <!-- =========================
         SECURITY STATUS
    ========================= -->

    <div class="security-card">

        <div class="security-title">

            🔐 সুরক্ষা কেন্দ্র

        </div>


        <div class="security-percent">

            100%

        </div>


        <div class="security-level">

            নিরাপত্তা শতাংশ: উচ্চ

        </div>


        <div class="progress-bg">

            <div class="progress-bar"></div>

        </div>


        <div class="login-info">


            <div class="login-row">

                <span class="login-label">

                    সর্বশেষ লগইন আইপি

                </span>


                <span
                    class="login-value"
                    id="lastLoginIP">

                    Loading...

                </span>

            </div>



            <div class="login-row">

                <span class="login-label">

                    সর্বশেষ লগইন সময়

                </span>


                <span
                    class="login-value"
                    id="lastLoginTime">

                    Loading...

                </span>

            </div>


        </div>

    </div>



    <!-- =========================
         PERSONAL INFORMATION
    ========================= -->

    <div class="section-title">

        ব্যক্তিগত তথ্য

    </div>


    <div class="option-card">


        <!-- ACCOUNT -->

        <button
            class="option-item"
            onclick="openAccount()">


            <div class="option-icon">

                👤

            </div>


            <div class="option-info">

                <div class="option-title">

                    ব্যক্তিগত তথ্য

                </div>


                <div class="option-desc">

                    ব্যক্তিগত তথ্য সম্পূর্ণ করুন।

                </div>

            </div>


            <div class="option-arrow">

                ›

            </div>

        </button>



        <!-- WALLET -->

        <button
            class="option-item"
            onclick="openWallet()">


            <div class="option-icon">

                💳

            </div>


            <div class="option-info">

                <div class="option-title">

                    ই-ওয়ালেট বাঁধুন

                </div>


                <div class="option-desc">

                    উত্তোলনের জন্য ই-ওয়ালেট বাঁধুন।

                </div>

            </div>


            <div class="option-arrow">

                ›

            </div>

        </button>



        <!-- PASSWORD -->

        <button
            class="option-item"
            onclick="openPasswordModal()">


            <div class="option-icon">

                🔑

            </div>


            <div class="option-info">

                <div class="option-title">

                    লগইন পাসওয়ার্ড পরিবর্তন করুন

                </div>


                <div class="option-desc">

                    প্রস্তাবিত অক্ষর এবং সংখ্যা সংমিশ্রণ

                </div>

            </div>


            <div class="option-arrow">

                ›

            </div>

        </button>


    </div>



    <!-- =========================
         LOGOUT
    ========================= -->

    <button
        class="logout-btn"
        onclick="logout()">

        🚪 লগআউট

        <br>

        <span
            style="
                font-size:11px;
                font-weight:400;
                color:#888;
            ">

            নিরাপদভাবে লগআউট করুন

        </span>

    </button>


</div>



<!-- =========================
     PASSWORD MODAL
========================= -->

<div
    class="modal"
    id="passwordModal">


    <div class="modal-box">


        <div class="modal-header">

            <h3>

                🔑 পাসওয়ার্ড পরিবর্তন

            </h3>


            <button
                class="close-btn"
                onclick="closePasswordModal()">

                ×

            </button>

        </div>



        <div class="password-note">

            নিরাপত্তার জন্য বর্তমান পাসওয়ার্ড দিন।
            নতুন পাসওয়ার্ডে অক্ষর ও সংখ্যা ব্যবহার করুন।

        </div>



        <div class="input-group">

            <label>

                বর্তমান পাসওয়ার্ড

            </label>


            <input
                type="password"
                id="currentPassword"
                placeholder="বর্তমান পাসওয়ার্ড">

        </div>



        <div class="input-group">

            <label>

                নতুন পাসওয়ার্ড

            </label>


            <input
                type="password"
                id="newPassword"
                placeholder="নতুন পাসওয়ার্ড">

        </div>



        <div class="input-group">

            <label>

                নতুন পাসওয়ার্ড আবার দিন

            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="পাসওয়ার্ড নিশ্চিত করুন">

        </div>



        <button
            class="password-btn"
            onclick="changePassword()">

            পাসওয়ার্ড পরিবর্তন করুন

        </button>


    </div>

</div>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


    <a
        href="dashboard.html"
        class="nav-item">

        <span class="nav-icon">

            ⌂

        </span>

        Home

    </a>



    <a
        href="referral.html"
        class="nav-item">

        <span class="nav-icon">

            👥

        </span>

        Referral

    </a>



    <a
        href="promotion.html"
        class="nav-item">

        <span class="nav-icon">

            🎁

        </span>

        Promotion

    </a>



    <a
        href="#"
        class="nav-item"
        onclick="
            alert('Service Center coming soon');
            return false;
        ">

        <span class="nav-icon">

            💬

        </span>

        Service

    </a>



    <a
        href="profile.html"
        class="nav-item active">

        <span class="nav-icon">

            👤

        </span>

        Member

    </a>


</nav>



<script>


    /* =========================
       API
    ========================= */

    const API_URL =
        "https://casinoplatform.onrender.com";


    const token =
        localStorage.getItem("token");


    /* =========================
       AUTH CHECK
    ========================= */

    if (!token) {

        window.location.href =
            "index.html";

    }



    /* =========================
       LOAD SECURITY DATA
    ========================= */

    async function loadSecurityData() {

        try {


            const response =
                await fetch(
                    `${API_URL}/api/me`,
                    {
                        method: "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "User loading failed"
                );

            }


            const user =
                data.user;


            /*
             * Backend-এ login IP/time
             * না থাকলে fallback text দেখাবে।
             */

            const ipElement =
                document.getElementById(
                    "lastLoginIP"
                );


            const timeElement =
                document.getElementById(
                    "lastLoginTime"
                );


            if (ipElement) {

                ipElement.textContent =
                    user.last_login_ip ||
                    "Not available";

            }


            if (timeElement) {

                timeElement.textContent =
                    user.last_login_at ||
                    "Not available";

            }


        } catch (error) {

            console.error(
                "Security data error:",
                error
            );


            const ipElement =
                document.getElementById(
                    "lastLoginIP"
                );


            const timeElement =
                document.getElementById(
                    "lastLoginTime"
                );


            if (ipElement) {

                ipElement.textContent =
                    "Not available";

            }


            if (timeElement) {

                timeElement.textContent =
                    "Not available";

            }

        }

    }


    loadSecurityData();



    /* =========================
       ACCOUNT
    ========================= */

    function openAccount() {

        window.location.href =
            "account.html";

    }



    /* =========================
       WALLET
    ========================= */

    function openWallet() {

        window.location.href =
            "wallet.html";

    }



    /* =========================
       PASSWORD MODAL
    ========================= */

    function openPasswordModal() {

        const modal =
            document.getElementById(
                "passwordModal"
            );


        if (modal) {

            modal.classList.add(
                "show"
            );

        }

    }



    function closePasswordModal() {

    const modal =
        document.getElementById(
            "passwordModal"
        );

    if (modal) {

        modal.classList.remove(
            "show"
        );

    }

}


/* =========================
   CHANGE PASSWORD
========================= */

async function changePassword() {

    const currentPassword =
        document.getElementById(
            "currentPassword"
        ).value.trim();

    const newPassword =
        document.getElementById(
            "newPassword"
        ).value.trim();

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value.trim();


    if (!currentPassword) {

        alert(
            "বর্তমান Password দিন।"
        );

        return;

    }


    if (!newPassword) {

        alert(
            "নতুন Password দিন।"
        );

        return;

    }


    if (newPassword.length < 6) {

        alert(
            "নতুন Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
        );

        return;

    }


    if (newPassword !== confirmPassword) {

        alert(
            "নতুন Password এবং Confirm Password মিলছে না।"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/change-password`,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`

                    },

                    body: JSON.stringify({

                        current_password:
                            currentPassword,

                        new_password:
                            newPassword

                    })

                }
            );


        const data =
            await response.json();


        alert(
            data.message ||
            "Password change completed."
        );


        if (data.success) {

            document.getElementById(
                "currentPassword"
            ).value = "";


            document.getElementById(
                "newPassword"
            ).value = "";


            document.getElementById(
                "confirmPassword"
            ).value = "";


            closePasswordModal();

        }


    } catch (error) {

        console.error(
            "Change password error:",
            error
        );

        alert(
            "Server Error"
        );

    }

}


/* =========================
   LOGOUT
========================= */

function logout() {

    const confirmLogout =
        confirm(
            "আপনি কি Logout করতে চান?"
        );


    if (!confirmLogout) {

        return;

    }


    localStorage.removeItem(
        "token"
    );


    window.location.href =
        "index.html";

}


/* =========================
   MODAL BACKGROUND CLOSE
========================= */

const passwordModal =
    document.getElementById(
        "passwordModal"
    );


if (passwordModal) {

    passwordModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closePasswordModal();

            }

        }
    );

}


/* =========================
   BACK BUTTON
========================= */

function goBack() {

    if (history.length > 1) {

        history.back();

    } else {

        window.location.href =
            "profile.html";

    }

}

</script>

</body>

</html>
