<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSK32 Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo">RSK32 Admin</div>

    <h1>Admin Dashboard</h1>

    <div class="card">
        <h3>Total Users</h3>
        <h2 id="totalUsers">0</h2>
    </div>

    <div class="card">
        <h3>Total Balance</h3>
        <h2 id="totalBalance">৳0.00</h2>
    </div>

    <div class="card">
        <h3>Pending Deposits</h3>
        <h2 id="pendingDeposits">0</h2>
    </div>

    <div class="card">
        <h3>Pending Withdrawals</h3>
        <h2 id="pendingWithdrawals">0</h2>
    </div>

    <hr>

    <h2>Quick Management</h2>

<button class="main-btn" onclick="loadUsers()">
    👥 Users
</button>

<button class="main-btn" onclick="alert('Deposits page coming next')">
    💰 Deposits
</button>

<button class="main-btn" onclick="alert('Withdrawals page coming next')">
    💸 Withdrawals
</button>

<button class="main-btn" onclick="alert('Rewards page coming next')">
    🎁 Rewards
</button>

<button class="main-btn" onclick="alert('VIP page coming next')">
    💎 VIP
</button>

    <hr>

    <h2>Users List</h2>

<div id="usersList">
    Loading users...
</div>

<hr>

<h2>Pending Deposits</h2>

<div id="depositsList">
    Loading deposits...
</div>
<hr>

<h2>Pending Withdrawals</h2>

<div id="withdrawalsList">
    Loading withdrawals...
</div>

<script src="admin.js?v=2"></script>

</body>
</html>
